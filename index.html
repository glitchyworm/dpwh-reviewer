<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DPWH Reviewer</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<!-- PASSWORD SCREEN -->
<div id="passwordScreen">

    <h1>DPWH Reviewer</h1>

    <p>Please enter the password to continue.</p>

    <input
        type="password"
        id="passwordInput"
        placeholder="Enter password"
    >

    <button id="loginBtn">
        Enter
    </button>

    <p id="passwordMessage"></p>

</div>

<div class="container">


    <!-- ======================= -->
    <!-- HOME SCREEN -->
    <!-- ======================= -->

    <div id="homeScreen">

        <h1>DPWH Reviewer</h1>

        <p id="questionCount">
            Loading questions...
        </p>

        <h3>
            Select Question Set
        </h3>

        <div id="setContainer"></div>

    </div>


    <!-- ======================= -->
    <!-- QUIZ SCREEN -->
    <!-- ======================= -->

    <div
        id="quizScreen"
        style="display:none"
    >

        <div id="progress"></div>

        <div id="questionsContainer"></div>

        <div class="navigation">

            <button id="prevBtn">
                Previous
            </button>

            <button id="nextBtn">
                Next
            </button>

            <button
                id="submitBtn"
                style="display:none;"
            >
                Submit
            </button>

        </div>

    </div>


    <!-- ======================= -->
    <!-- RESULT SCREEN -->
    <!-- ======================= -->

    <div
        id="resultScreen"
        style="display:none"
    >

        <h2>
            Quiz Finished!
        </h2>

        <h3 id="scoreText"></h3>

        <button id="reviewBtn">
            Review Answers
        </button>

        <button id="newQuizBtn">
            New Quiz
        </button>

    </div>


    <!-- ======================= -->
    <!-- REVIEW SCREEN -->
    <!-- ======================= -->

   <div id="reviewScreen" style="display:none">

    <div id="reviewProgress"></div>

    <div id="reviewQuestionsContainer"></div>

    <div class="navigation">

        <button id="reviewPrevBtn">
            Previous
        </button>

        <button id="reviewNextBtn">
            Next
        </button>

    </div>

</div>

    </div>


</div>


<script src="app.js"></script>

</body>

</html>
